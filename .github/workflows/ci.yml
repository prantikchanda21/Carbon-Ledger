name: Continuous integration
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run deploy:preflight:installed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  quantum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r quantum_lab/requirements.txt pytest
      - run: python -m pytest tests/test_quantum.py tests/test_quantum_v8.py
